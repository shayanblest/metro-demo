<div class="p-4 card card-flush">
  <div class="row justify-content-between align-items-center mb-5">
    <div class="col-4">

    </div>
    <div class="col-auto">
      <a *hasAccess="'Roles:C'" [routerLink]="['/admin/roles/edit']" class="btn btn-primary">
        <i class="bi bi-person-plus fs-4 me-2 align-middle"></i>
        نقش جدید</a>
    </div>
  </div>
  <table class="table not-printable">
    <thead>
    <tr>
      <th>نام</th>
      <th>نام نمایشی</th>
      <th>عملیات</th>
    </tr>
    </thead>
    <tbody>

      @for (role of roles(); track role.id) {
        <tr>
          <td>{{ role.name }}</td>
          <td>{{ role.displayName }}</td>
          <td>
            <a class="btn btn-info me-3" [routerLink]="['/admin/roles/edit', role.id]">جزئیات</a>
          </td>
        </tr>
      }
    </tbody>
  </table>

  <div class="row justify-content-between">
    <div class="col-auto">
      <select [value]="listQuery.length || 10" class="form-select form-control-solid" pageLength>
        <option>10</option>
        <option>25</option>
        <option>50</option>
        <option>100</option>
      </select>
    </div>
    <app-pagination [totalRecords]="total()" class="col-auto"></app-pagination>
  </div>

</div>
